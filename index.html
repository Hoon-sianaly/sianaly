<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIANALY</title>
<style>
:root{color-scheme:light;--ink:#17243b;--muted:#7b8595;--line:#e7ebf0;--blue:#3568e8}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;color:var(--ink);background:#f7f8fa}a{color:inherit;text-decoration:none}button,input{font:inherit}
header{height:76px;max-width:1160px;margin:auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:21px;font-weight:800;letter-spacing:-.8px}.logo span{color:var(--blue)}.nav{font-size:13px;color:#677386}.nav span{margin-left:8px;color:var(--blue)}
.hero{text-align:center;padding:70px 24px 78px}.hero h1{font-size:88px;font-weight:800;letter-spacing:-5px;line-height:1.05;margin:0}.hero h1 span{color:var(--blue)}.hero p{font-size:22px;font-weight:400;letter-spacing:-.7px;color:#647086;margin:22px 0 0}
.search{position:relative;max-width:640px;margin:38px auto 0}.search input{height:66px;width:100%;border:1px solid #dfe5ed;border-radius:18px;background:#fff;padding:0 58px;font-size:16px;color:var(--ink);outline:none;box-shadow:0 8px 28px #17243b06;transition:border-color .2s,box-shadow .2s}.search input::placeholder{color:#98a1af}.search input:focus{border-color:#7195ee;box-shadow:0 0 0 4px #3568e80b,0 8px 28px #17243b06}.search-icon{position:absolute;left:22px;top:23px;width:20px;height:20px;color:#78879d;pointer-events:none}.search-enter{position:absolute;right:19px;top:21px;border:1px solid #edf0f5;border-radius:6px;color:#a5aebc;font-size:16px;width:25px;height:25px;line-height:23px;pointer-events:none}
.results{position:absolute;top:76px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:16px;text-align:left;overflow:auto;max-height:360px;z-index:10;box-shadow:0 12px 36px #17243b12}.hidden{display:none}.result{padding:16px 20px;border-bottom:1px solid #f0f2f6;cursor:pointer}.result:last-child{border-bottom:0}.result:hover{background:#f4f7fd}.result b{display:block;font-size:15px}.result span{display:block;font-size:12px;color:var(--muted);margin-top:5px}
main{max-width:1160px;padding:0 28px;margin:auto}.section{margin:0 0 48px}.discovery-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.discovery-head h2{font-size:20px;letter-spacing:-.7px;margin:0;font-weight:700}.discovery-sub{font-size:13px;color:var(--muted);line-height:1.7;margin:10px 0 0}.company-count{font-size:12px;color:#7b8595}.industry-filters{display:flex;gap:7px;flex-wrap:wrap;margin:24px 0 20px}.industry-filter{border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fff;color:#687487;font-size:12px;cursor:pointer;transition:.15s}.industry-filter:hover{border-color:#b7c7e8;color:var(--ink)}.industry-filter[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}.company-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.company-card{position:relative;display:block;padding:22px 18px;background:#fff;border:1px solid var(--line);border-radius:14px;transition:border-color .15s,box-shadow .15s}.company-card:hover,.company-card:focus-visible{border-color:#93b0f1;box-shadow:0 5px 18px #17243b06}.company-card::after{content:"↗";position:absolute;right:16px;top:19px;font-size:14px;color:#b4bece}.company-card b{display:block;padding-right:14px;font-size:15px;line-height:1.5;letter-spacing:-.3px;overflow-wrap:anywhere}.company-card span{display:block;font-size:11px;color:#929cac;margin-top:7px;line-height:1.5}.company-card .industry-label{display:inline-block;font-size:11px;color:#627ba7;background:#f1f5fc;border-radius:5px;padding:3px 7px;margin-top:19px}.ranking-caption{font-size:11px;color:#939cab;line-height:1.7;margin:16px 0 0}
#homeRecent{padding-bottom:28px;margin-bottom:30px;border-bottom:1px solid var(--line)}#homeRecent h2{font-size:15px;color:#69768a}.recent-home-list{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.recent-home-list .company-card{padding:14px 16px;min-width:155px}.recent-home-list .company-card b{font-size:13px}.recent-home-list .company-card::after{display:none}.discovery-empty{font-size:13px;color:var(--muted);line-height:1.7}.discovery-retry{padding:8px 12px;cursor:pointer}
footer{max-width:1104px;margin:58px auto 0;padding:24px 0 32px;border-top:1px solid var(--line)}.footer-brand{font-size:12px;font-weight:700;letter-spacing:1px;color:#8993a3}.notice{font-size:11px;color:#9aa3b0;line-height:1.8;margin:10px 0 0;max-width:790px}button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
@media(max-width:1000px){.company-grid{grid-template-columns:repeat(4,minmax(0,1fr))}footer{margin-left:28px;margin-right:28px}}@media(max-width:760px){.company-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{padding-top:60px;padding-bottom:64px}.hero h1{font-size:72px}.hero p{font-size:20px}}
@media(max-width:540px){header{height:64px;padding:0 20px}.logo{font-size:18px}.nav{font-size:12px}.hero{padding:46px 20px 52px}.hero h1{font-size:clamp(47px,12vw,64px);letter-spacing:-3px}.hero p{font-size:18px;margin-top:17px}.search{margin-top:28px}.search input{height:60px;border-radius:14px;font-size:14px;padding:0 42px 0 48px}.search-icon{left:17px;top:20px}.search-enter{right:12px;top:18px;width:23px;height:23px}.results{top:68px}main{padding:0 20px}.discovery-head h2{font-size:18px}.company-count{font-size:11px}.industry-filters{gap:6px;margin:20px 0 16px}.industry-filter{padding:8px 10px;font-size:11px}.company-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.company-card{padding:18px 13px;border-radius:12px}.company-card b{font-size:14px}.company-card::after{right:11px;top:17px}.company-card .industry-label{margin-top:14px;font-size:10px}.section{margin-bottom:32px}.recent-home-list .company-card{min-width:0;flex:1 1 120px}footer{margin:42px 20px 0;padding-bottom:26px}.notice{font-size:10px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style></head>
<body>
<header><a class="logo" href="index.html" aria-label="SIANALY 홈">SI<span>ANALY</span></a><a class="nav" href="#companyDiscovery">기업 둘러보기<span aria-hidden="true">↓</span></a></header>
<section class="hero">
<h1>SI<span>ANALY</span></h1>
<p>한눈에 보는 기업분석</p>
<div class="search"><svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><span class="search-enter" aria-hidden="true">↵</span><input id="q" aria-label="기업명 또는 종목코드 검색" placeholder="기업명 또는 종목코드 검색" autocomplete="off"><div id="r" class="results hidden"></div></div>
</section>
<main><section class="section" id="homeRecent" hidden><div class="discovery-head"><h2>최근 본 기업</h2></div><div id="homeRecentList" class="recent-home-list"><p class="discovery-empty">기업분석을 열면 여기에 최근 본 기업이 표시됩니다.</p></div></section>
<section class="section" id="companyDiscovery"><div class="discovery-head"><h2>분석 가능한 기업</h2><span id="companyCount" class="company-count" role="status"></span></div><p class="discovery-sub">코스피 시가총액 TOP 10을 먼저 확인하고, 업종별로 상위 280개 종목을 둘러보세요.</p><div id="industryFilters" class="industry-filters" role="group" aria-label="업종 필터"></div><div id="companyGrid" class="company-grid" aria-label="분석 가능한 기업 목록"><p class="discovery-empty" role="status">기업 목록을 불러오는 중입니다.</p></div><p class="ranking-caption" id="rankingAsOf"></p></section>
</main>
<footer><div class="footer-brand">SIANALY</div><p class="notice">SIANALY는 기업 및 산업에 관한 정보와 분석을 제공하는 서비스입니다. 특정 금융상품의 매수·매도 또는 투자 여부를 권유하는 서비스가 아닙니다.</p></footer>
<script src="company-data.js?v=20261009-kospi280-1"></script>
<script src="home-discovery.js?v=20261009-kospi280-1"></script>
<script>
let companies=[], catalogState="loading";
const q=document.getElementById("q"),r=document.getElementById("r");
const normalize=v=>v.toLowerCase().replace(/\s+/g,"");
function matches(c,s){return [c.name,c.ticker,c.alias||""].some(v=>normalize(v).includes(normalize(s)))}
loadCompanyCatalog().then(catalog=>{companies=catalog.companies;catalogState="ready";render(q.value)}).catch(error=>{console.error(error);catalogState="error";render(q.value)});
function render(v){let s=v.trim().toLowerCase();if(!s){r.className="results hidden";return}
if(catalogState!=="ready"){r.innerHTML=`<div class="result" role="status"><b>${catalogState==="loading"?"기업 목록을 불러오는 중입니다.":"기업 목록을 불러오지 못했습니다."}</b><span>${catalogState==="loading"?"잠시만 기다려 주세요.":"페이지를 새로고침해 다시 시도해 주세요."}</span></div>`;r.className="results";return}
let m=companies.filter(c=>matches(c,s));
r.innerHTML=m.length?m.map(c=>`<div class="result" data-key="${c.key}"><b>${c.name}</b><span>${c.ticker} · ${c.market}</span></div>`).join(""):`<div class="result"><b>검색 결과가 없습니다.</b><span>현재 등록된 기업만 검색할 수 있습니다.</span></div>`;
r.className="results";}
function go(c){location.href=`company.html?company=${encodeURIComponent(c.key)}`}
q.addEventListener("input",e=>render(e.target.value));
q.addEventListener("keydown",e=>{if(e.key==="Escape"){r.className="results hidden";return}if(e.key!=="Enter")return;let s=q.value.trim().toLowerCase();if(!s)return;let c=companies.find(x=>matches(x,s));if(c){e.preventDefault();go(c)}});
r.addEventListener("click",e=>{let x=e.target.closest(".result[data-key]");if(!x)return;let c=companies.find(c=>c.key===x.dataset.key);if(c)go(c)});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))r.className="results hidden"});
</script></body></html>

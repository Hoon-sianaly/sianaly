<body>
<header><a class="logo" href="index.html" style="color:inherit">SI<span>ANALY</span>.</a><div class="company-search"><input id="companySearch" type="search" placeholder="다른 기업 검색 · 기업명 또는 종목코드" aria-label="다른 기업 검색" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="companySearchResults" autocomplete="off"><div id="companySearchResults" class="company-search-results" role="listbox" aria-label="기업 검색 결과" hidden></div></div></header>
<main><div class="layout" id="layout"><div id="app" class="content"></div><aside class="side" id="recentSide"><div class="recent" id="recentBox"><div class="recent-head"><h3>최근 본 기업</h3><button class="recent-toggle" id="recentToggle" type="button" aria-label="최근 본 기업 닫기">→</button></div><div class="recent-sub">이 브라우저에서 본 기업</div><div id="recentList"></div></div></aside></div><button class="side-open hidden" id="sideOpen" type="button" aria-label="최근 본 기업 열기">←</button></main>
<script src="company-data.js?v=20261008-kospi150-2"></script>
<script src="company-search.js?v=20261007-detail-search-1"></script>
<script>
const key=new URLSearchParams(location.search).get("company");
const app=document.getElementById("app");
(async function initCompanyPage(){
app.innerHTML='<section class="empty" role="status">기업 정보를 불러오는 중입니다.</section>';
const c=await loadCompanyData(key);
const recentCatalog=(await loadCompanyCatalog()).companies;
const compact=c?.presentation.compact === true;
const comparison=c?.presentation.chartStyle === "comparison";
if(compact)document.body.classList.add("samsung-page");
const recentList=document.getElementById("recentList");
const recentBox=document.getElementById("recentBox"),recentToggle=document.getElementById("recentToggle");
const recentSide=document.getElementById("recentSide"),layout=document.getElementById("layout"),sideOpen=document.getElementById("sideOpen");
let recentEnabled=localStorage.getItem("sianalyRecentEnabled")!=="false";
function renderRecentState(){
 recentSide.classList.toggle("side-hidden",!recentEnabled);
 layout.classList.toggle("no-side",!recentEnabled);
 sideOpen.classList.toggle("hidden",recentEnabled);
}
recentToggle.addEventListener("click",()=>{recentEnabled=false;localStorage.setItem("sianalyRecentEnabled","false");renderRecentState()});
sideOpen.addEventListener("click",()=>{recentEnabled=true;localStorage.setItem("sianalyRecentEnabled","true");renderRecentState()});
renderRecentState();
function updateRecent(){
 if(!c)return;
 let items=[];try{const stored=JSON.parse(localStorage.getItem("sianalyRecent")||"[]");if(Array.isArray(stored))items=stored;}catch(e){}
 const seen=new Set([key]);items=items.flatMap(item=>{const entry=recentCatalog.find(entry=>entry.key===item?.key);if(!entry||seen.has(entry.key))return [];seen.add(entry.key);return [{key:entry.key,name:entry.name,ticker:entry.ticker}];});items.unshift({key,name:c.name,ticker:c.ticker});items=items.slice(0,5);
 try{localStorage.setItem("sianalyRecent",JSON.stringify(items))}catch(e){}
 recentList.innerHTML=items.length?items.map(x=>`<a class="recent-item" href="company.html?company=${encodeURIComponent(x.key)}"><b>${esc(x.name)}</b><span>${esc(x.ticker)}</span></a>`).join(""):'<div class="recent-empty">아직 본 기업이 없습니다.</div>';
}
const esc=v=>String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const salesLabel=c?esc(c.financialMetrics.sales.label):"매출",opLabel=c?esc(c.financialMetrics.op.label):"영업이익";
function sourceLinks(ids){
 ids=ids.filter(id=>c.sourceLinks[id]);
 if(!ids.length)return "";
 return `<div class="source-links"><b>공식 자료</b><ul>${ids.map(id=>{const s=c.sourceLinks[id];return `<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.label)}</a>${s.published?` · 발표 ${esc(s.published)}`:s.asOf?` · 자료 기준 ${esc(s.asOf)}`:""}</li>`}).join("")}</ul><span>확인일: ${esc(c.verifiedAt)}</span></div>`;
}
function comparisonChart(rows){
 const metrics=[{field:"sales",title:c.financialMetrics.sales.label,help:c.financialMetrics.sales.help,color:"#2563eb"},{field:"op",title:c.financialMetrics.op.label,help:c.financialMetrics.op.help,color:"#111827"}];
 return `<div class="metric-charts">${metrics.map(m=>{
  const rawValues=rows.map(r=>r[m.field]), unit=financialDisplayUnit(Math.max(...rawValues.map(Math.abs),0));
  const values=rawValues.map(value=>value*unit.factor), highest=Math.max(...values,0), lowest=Math.min(...values,0);
  const magnitude=Math.pow(10,Math.floor(Math.log10(Math.max(highest,Math.abs(lowest),0.1)))), step=magnitude/2;
  const upper=Math.max(step,Math.ceil(highest/step)*step), lower=lowest<0?Math.floor(lowest/step)*step:0;
  const left=45, right=350, top=28, bottom=208, y=value=>bottom-(value-lower)/(upper-lower)*(bottom-top), zero=y(0);
  const ticks=[...new Set([upper,upper/2,0,...(lower<0?[lower]:[])])];
  const slots=(right-left)/Math.max(rows.length,1), width=Math.min(48,slots*0.5);
  const labels=rows.map(r=>`${r.quarter?r.quarter+"분기":r.period}: ${formatFinancialHighlight(r[m.field])}`).join(", ");
  return `<figure class="metric-panel"><figcaption>${esc(m.title)}</figcaption><p class="desc">${esc(m.help)}</p><svg class="vertical-chart" viewBox="0 0 370 252" role="img" aria-label="${esc(m.title+": "+labels)}"><title>${esc(m.title+": "+labels)}</title>
  ${ticks.map(value=>`<line x1="${left}" y1="${y(value)}" x2="${right}" y2="${y(value)}" stroke="${value===0?"#94a3b8":"#e2e8f0"}"/><text x="${left-8}" y="${y(value)+4}" text-anchor="end" class="axis-label">${formatFinancialNumber(value)}</text>`).join("")}
  <text x="${left}" y="12" class="axis-label">단위: ${unit.label}</text>
  ${rows.map((r,i)=>{const value=r[m.field]*unit.factor,x=left+slots*(i+0.5),pos=y(value);return `<rect x="${x-width/2}" y="${Math.min(pos,zero)}" width="${width}" height="${Math.abs(zero-pos)}" rx="3" fill="${value<0?"#dc2626":m.color}"/><text x="${x}" y="${value<0?pos+15:pos-8}" text-anchor="middle" class="value-label">${formatFinancialHighlight(r[m.field])}</text><text x="${x}" y="238" text-anchor="middle" class="axis-label">${esc(r.quarter?r.quarter+"분기":r.period)}</text>`}).join("")}
  </svg></figure>`;
 }).join("")}</div><p class="chart-reading">${salesLabel}과 ${opLabel}은 눈금이 다르므로 같은 그래프 안에서 기간별 변화를 비교해 주세요. 금액은 규모에 따라 조원·억원·만원·원으로 표시하며, 각 그래프의 눈금 단위는 왼쪽 위에 표시합니다. 조원은 소수점 둘째 자리까지, 그보다 작은 단위는 정수로 반올림합니다.${rows.some(r=>r.op<0)?(c.financialMetrics.op.label==="영업이익"?" 영업손실은 0선 아래에 표시합니다.":" 손실은 0선 아래에 표시합니다."):""}</p>`;
}
function chart(rows){return comparisonChart(rows)}
function twoMetricChart(rows){return comparisonChart(rows)}
function metricChange(current,previous,profit=false){
 if(!Number.isFinite(current)||!Number.isFinite(previous))return '비교 자료 없음';
 if(profit){
  if(previous<0&&current>0)return '흑자 전환';
  if(previous>0&&current<0)return '적자 전환';
  if(previous<0&&current<0)return current>previous?'적자 축소':current<previous?'적자 확대':'적자 동일';
  if(previous<0&&current===0)return '손익분기';
 }
 if(previous===0)return current===0?'변화 없음':'비교 기준 0';
 const change=(current-previous)/Math.abs(previous)*100;
 const rounded=Math.round(change*10)/10;
 return `${rounded>0?'+':''}${rounded.toFixed(1)}%`;
}
function financialInsights(row,previous,basis){
 if(!row)return '';
 const profitMetric=/이익|손익/.test(c.financialMetrics.op.label);
 const cards=[{label:`${salesLabel} 증감`,value:metricChange(row.sales,previous?.sales),help:previous?basis:'비교할 이전 기간 자료가 없습니다.'},{label:`${opLabel} 증감`,value:metricChange(row.op,previous?.op,profitMetric),help:previous?basis:'비교할 이전 기간 자료가 없습니다.'}];
 const ordinary=c.financialMetrics.sales.label==='매출'&&c.financialMetrics.op.label==='영업이익';
 if(ordinary)cards.push({label:'영업이익률',value:row.sales>0?`${(row.op/row.sales*100).toFixed(1)}%`:'산출 불가',help:'영업이익 ÷ 매출 × 100'});
 return `<div class="insight-grid">${cards.map(card=>`<div class="insight-card"><span>${card.label}</span><strong>${card.value}</strong><small>${card.help}</small></div>`).join('')}</div><p class="insight-note">${row.year}년${row.quarter?` ${row.quarter}분기`:''} 실적 기준 · 증감률은 표시값으로 반올림하기 전 수치로 계산합니다.${ordinary?'':' 이 기업은 일반 매출·영업이익과 지표 구성이 달라 영업이익률을 표시하지 않습니다.'}</p>`;
}
if(!c){app.innerHTML='<section class="empty">기업 정보를 찾을 수 없습니다.<br><br><a href="index.html">기업 검색으로 돌아가기</a></section>';}
else{
 const latestAnnual=c.annual.at(-1),previousAnnual=c.annual.find(row=>row.year===latestAnnual.year-1);
 const latestQuarter=c.latestQuarter;

 const toc=document.getElementById("companyToc");
 if(typeof matchMedia==="function"){
  const smallScreen=matchMedia("(max-width:700px)");

  toc.addEventListener("click",event=>{if(smallScreen.matches && event.target.closest("a"))toc.open=false;});
 }
 if(typeof window!=='undefined'){
  const links=[...toc.querySelectorAll('.toc-links a')],sections=links.map(link=>document.querySelector(link.getAttribute('href')));
  let scheduled=false;
  function highlightSection(){
   scheduled=false;const line=document.querySelector('header').getBoundingClientRect().bottom+45;
   let current=0;sections.forEach((section,index)=>{if(section.getBoundingClientRect().top<=line)current=index;});
   if(window.scrollY+window.innerHeight>=document.documentElement.scrollHeight-4)current=sections.length-1;
   links.forEach((link,index)=>{if(index===current)link.setAttribute('aria-current','location');else link.removeAttribute('aria-current');});
   toc.querySelector('summary').textContent=matchMedia('(max-width:700px)').matches?`목차 · ${links[current].textContent}`:'목차';
  }
  function queueHighlight(){if(!scheduled){scheduled=true;requestAnimationFrame(highlightSection);}}
  window.addEventListener('scroll',queueHighlight,{passive:true});window.addEventListener('resize',queueHighlight);highlightSection();
 }

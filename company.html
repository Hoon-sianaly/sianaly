<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIANALY — 기업 분석</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#171717;font-family:Arial,"Noto Sans KR",sans-serif}
header{height:70px;background:#fff;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;justify-content:space-between;padding:0 7%}
.logo{font-size:23px;font-weight:800;color:#171717}a{text-decoration:none;color:#777}
main{max-width:920px;margin:auto;padding:42px 20px 80px}.hero{padding:34px 4px 30px}.meta{font-size:13px;color:#777;font-weight:700}.hero h1{font-size:42px;letter-spacing:-1.8px;margin:10px 0 12px}.intro{font-size:17px;color:#5f6368;line-height:1.75;max-width:760px}
.snapshot{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.stat{background:#fff;border:1px solid #e8e8e8;border-radius:14px;padding:14px 16px;min-width:150px}.stat small{display:block;color:#888;margin-bottom:5px}.stat strong{font-size:18px}
section{background:#fff;border:1px solid #e8e8e8;border-radius:20px;padding:30px;margin-top:16px}.eyebrow{font-size:12px;font-weight:800;color:#777}.title{font-size:25px;font-weight:800;letter-spacing:-.7px;margin:7px 0 8px}.desc{color:#777;line-height:1.65;margin:0 0 22px}
.summary{counter-reset:item}.line{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid #f0f0f0;line-height:1.65}.line:last-child{border:0}.line b{color:#999;min-width:18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.box{background:#f7f8fa;border-radius:14px;padding:19px}.box h3{font-size:16px;margin:0 0 8px}.box p{font-size:14px;margin:0;color:#666;line-height:1.6}
.tabs{display:flex;gap:7px;margin:18px 0 6px}.tab{border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 13px;font-size:12px;cursor:pointer}.tab.active{background:#171717;color:#fff;border-color:#171717}
.chart{margin-top:18px}.bars{height:230px;display:flex;align-items:flex-end;gap:18px;border-bottom:1px solid #ddd;padding:0 12px}.pair{height:100%;flex:1;display:flex;align-items:flex-end;justify-content:center;gap:5px;position:relative;padding-bottom:25px}.bar{width:28px;background:#d9e5ff;border-radius:6px 6px 0 0;min-height:3px}.bar.op{background:#222}.labels{position:absolute;bottom:4px;font-size:11px;color:#777;white-space:nowrap}.values{font-size:10px;color:#666;position:absolute;bottom:calc(var(--h) + 30px);white-space:nowrap}.legend{font-size:12px;color:#777;margin-top:12px}.legend span{margin-right:15px}.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:#d9e5ff}.dot.op{background:#222}
.flow{display:grid;gap:10px}.flow-item{display:grid;grid-template-columns:180px 28px 1fr;align-items:center;background:#f7f8fa;border-radius:14px;padding:16px}.flow-item strong{font-size:15px}.arrow{text-align:center;color:#aaa}.flow-item p{margin:0;color:#666;font-size:14px;line-height:1.55}
.source{font-size:11px;color:#999;line-height:1.7;margin-top:22px}.empty{text-align:center}
@media(max-width:650px){main{padding-top:25px}.hero h1{font-size:34px}.grid{grid-template-columns:1fr}.stat{flex:1;min-width:130px}.flow-item{grid-template-columns:1fr}.arrow{text-align:left;transform:rotate(90deg);margin:4px 0}.bars{gap:8px;padding:0 4px}.bar{width:20px}section{padding:23px}}
</style></head>
<body>
<header><a class="logo" href="index.html">SIANALY.</a><a href="index.html">← 기업 검색</a></header>
<main id="app"></main>
<script src="companies.js"></script>
<script>
const key=new URLSearchParams(location.search).get("company"),c=companies[key],app=document.getElementById("app");
const esc=v=>String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function chart(rows){
 const max=Math.max(...rows.flatMap(x=>[Math.abs(x.sales),Math.abs(x.op)]),.01);
 return '<div class="chart"><div class="bars">'+rows.map(x=>{
  const sh=Math.max(3,Math.abs(x.sales)/max*165),oh=Math.max(3,Math.abs(x.op)/max*165);
  return '<div class="pair"><div class="bar" style="height:'+sh+'px" title="매출 '+x.sales+'조원"></div><div class="bar op" style="height:'+oh+'px" title="영업이익 '+x.op+'조원"></div><span class="labels">'+esc(x.period)+'</span></div>';
 }).join("")+'</div><div class="legend"><span><i class="dot"></i>매출</span><span><i class="dot op"></i>영업이익</span><span>단위: 조원 · 막대에 마우스를 올리면 수치를 볼 수 있습니다.</span></div></div>';
}
if(!c){app.innerHTML='<section class="empty">기업 정보를 찾을 수 없습니다.<br><br><a href="index.html">기업 검색으로 돌아가기</a></section>'}
else{
 app.innerHTML=`
 <div class="hero">
  <div class="meta">${c.ticker} · ${c.type}</div><h1>${c.name}</h1><div class="intro">${c.summary}</div>
  <div class="snapshot"><div class="stat"><small>${c.latestYear} 매출</small><strong>${c.latestSales}</strong></div><div class="stat"><small>${c.latestYear} 영업이익</small><strong>${c.latestOp}</strong></div><div class="stat"><small>시가총액</small><strong>${c.marketCap}</strong></div></div>
 </div>
 <section><div class="eyebrow">01 · 한눈에 이해하기</div><div class="title">${c.name}을 5줄로</div><div class="summary">${c.takeaways.map((x,i)=>'<div class="line"><b>0'+(i+1)+'</b><span>'+esc(x)+'</span></div>').join("")}</div></section>
 <section><div class="eyebrow">02 · 이 회사는 어떻게 돈을 벌까?</div><div class="title">사업 구조</div><p class="desc">복잡한 사업보고서 대신, 돈을 버는 주요 사업부터 쉽게 봅니다.</p><div class="grid">${c.business.map(x=>'<div class="box"><h3>'+esc(x.name)+'</h3><p>'+esc(x.desc)+'</p></div>').join("")}</div></section>
 <section><div class="eyebrow">03 · 실적은 어떻게 변했을까?</div><div class="title">매출과 영업이익 흐름</div><p class="desc">숫자를 전부 외울 필요 없이, 실적의 방향이 좋아지는지 나빠지는지 먼저 확인합니다.</p>
  <div class="tabs"><button class="tab active" data-chart="annual">연간</button><button class="tab" data-chart="quarter">2026 분기</button></div><div id="chart">${chart(c.annual)}</div>
 </section>
 <section><div class="eyebrow">04 · 무엇이 실적을 움직일까?</div><div class="title">핵심 변수</div><p class="desc">이 회사의 실적이 왜 움직이는지 원인과 영향을 연결해서 봅니다.</p>
  <div class="flow">${c.drivers.map(x=>'<div class="flow-item"><strong>'+esc(x.title)+'</strong><div class="arrow">→</div><p>'+esc(x.desc)+'</p></div>').join("")}</div>
  <div class="source"><b>출처</b> · ${c.sources.map(esc).join(" · ")}<br>시장 데이터 기준일: ${esc(c.marketDate)}<br>SIANALY는 기업 정보와 분석을 제공하며 특정 금융상품의 매수·매도를 권유하지 않습니다.</div>
 </section>`;
 document.querySelectorAll(".tab").forEach(btn=>btn.onclick=()=>{
   document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));btn.classList.add("active");
   document.getElementById("chart").innerHTML=chart(btn.dataset.chart==="annual"?c.annual:c.q2026);
 });
}
</script></body></html>
